# Daari Water — API Nginx vhost
# -----------------------------------------------------------------------------
# Install at /etc/nginx/sites-available/daari-water-api and symlink into
# /etc/nginx/sites-enabled/. After dropping in, run:
#   certbot --nginx -d api.phi-bit.com
# to provision the Let's Encrypt cert (certbot rewrites this file in-place).
#
# The app listens on 127.0.0.1:3004 via the daari-water-api.service unit.
# Port 3004 was chosen because 3000-3003 are claimed by other projects in
# /root/PROJECTS.md (daari, dr-cars, phibit).
#
# History: this was originally api.maa-iq.com, but maa-iq.com isn't on
# Phi-Bit's Cloudflare account, so we switched to a subdomain of
# phi-bit.com to ship faster. When maa-iq.com is added to Cloudflare we
# can add it as a second server_name + cert SAN.

server {
    listen 80;
    listen [::]:80;
    server_name api.phi-bit.com;

    # Certbot will move this whole block to listen 443 + TLS after running
    # the --nginx flag. Plain :80 is here only so the initial cert challenge
    # has somewhere to land.
    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Reasonable upload limit for proof-of-refill photos.
        client_max_body_size 10M;

        # NestJS responds quickly; if we ever block beyond 60s something
        # has gone wrong and we'd rather fail fast than queue.
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Static uploads — proof-of-delivery photos (/uploads/proof/) and generated
    # report files (/uploads/reports/<tenantId>/). NestJS does NOT serve these
    # (no ServeStaticModule/useStaticAssets), and the `location /` block above
    # would proxy them to the app → 404. This alias serves them straight from
    # disk. The path MUST equal UPLOADS_DIR in .env (default per template:
    # /var/www/daari-water-api/uploads) and stay inside the systemd
    # ReadWritePaths so the app can write what nginx reads.
    #
    # Security note: filenames are unguessable UUIDs (capability URLs). Report
    # files can carry tenant PII, but they expire after 24h and the UUID is the
    # only handle — acceptable for MVP. If stricter isolation is needed later,
    # move /uploads/reports/ behind an authenticated Nest route that re-checks
    # tenantId instead of this static alias.
    location /uploads/ {
        alias /var/www/daari-water-api/uploads/;
        add_header Cache-Control "private, max-age=86400";
        access_log off;
        # Don't leak directory contents if an index request slips through.
        autoindex off;
        try_files $uri =404;
    }

    # Lightweight uptime check that doesn't hit the app server.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
