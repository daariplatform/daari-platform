# Daari Dashboard + public legal pages — Nginx vhost
# -----------------------------------------------------------------------------
# Install at /etc/nginx/sites-available/daari-dashboard, symlink into
# sites-enabled, then run:
#   certbot --nginx -d daari-admin.phi-bit.com
#
# The Next.js app listens on 127.0.0.1:3002 via the daari-dashboard.service.

server {
    listen 80;
    listen [::]:80;
    server_name daari-admin.phi-bit.com;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static Next.js build assets — let Nginx serve them with aggressive
    # caching, bypassing the Node process.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Public legal pages need to be reachable without auth for Play Store
    # review — handled by the dashboard's /legal/* routes (see
    # src/app/legal/layout.tsx).
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
