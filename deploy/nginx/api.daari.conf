# Daari API — Nginx vhost
# -----------------------------------------------------------------------------
# Install at /etc/nginx/sites-available/daari-api and symlink into
# /etc/nginx/sites-enabled/. After dropping in, run:
#   certbot --nginx -d api.maa-iq.com
# to provision the Let's Encrypt cert (certbot rewrites this file in-place).
#
# The actual app listens on 127.0.0.1:3001 via the daari-api.service unit.

server {
    listen 80;
    listen [::]:80;
    server_name api.maa-iq.com;

    # Certbot will move this whole block to listen 443 + TLS after running
    # the --nginx flag. Plain :80 is here only so the initial cert challenge
    # has somewhere to land.
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Reasonable upload limit for proof-of-refill photos.
        client_max_body_size 10M;

        # NestJS responds quickly; if we ever block beyond 60s something
        # has gone wrong and we'd rather fail fast than queue.
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Lightweight uptime check that doesn't hit the app server.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
