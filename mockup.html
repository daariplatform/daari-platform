  .pulse-dot {
    position:relative; width:14px; height:14px; background:#06b6d4; border-radius:999px;
    box-shadow:0 0 0 4px rgba(6,182,212,.25);
  }
  .pulse-dot::after {
    content:''; position:absolute; inset:-6px; border:2px solid #06b6d4; border-radius:999px;
    animation:ripple 1.6s ease-out infinite; opacity:0;
  }
  @keyframes ripple { 0% { transform:scale(.4); opacity:.8; } 100% { transform:scale(2.6); opacity:0; } }
  .seg-active { background:#fff; color:#0f172a; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .nav-active { background:linear-gradient(135deg,#06b6d4,#0284c7); color:white; box-shadow:0 4px 12px rgba(6,182,212,.3); }

  .status-enroute    { background:#ffedd5; color:#9a3412; }
  .status-completed  { background:#dcfce7; color:#166534; }
  .status-cancelled  { background:#fee2e2; color:#991b1b; }
  .toast {
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:#0f172a; color:white; padding:12px 22px; border-radius:14px;
    font-weight:700; z-index:100; opacity:0; transition:opacity .25s, transform .25s;
    pointer-events:none; box-shadow:0 10px 25px rgba(0,0,0,.25);
  }
  .toast.show { opacity:1; transform:translate(-50%,-8px); }
  .toast.success { background:linear-gradient(135deg,#06b6d4,#0284c7); }
  .toast.warn { background:linear-gradient(135deg,#fbbf24,#d97706); }
  .num { font-variant-numeric:tabular-nums; }
  .pill { padding:6px 14px; border-radius:999px; font-size:12px; font-weight:700; white-space:nowrap; }
  .gcard-1 { background:linear-gradient(135deg,#06b6d4,#0284c7); }
  .gcard-2 { background:linear-gradient(135deg,#22c55e,#16a34a); }
  .gcard-3 { background:linear-gradient(135deg,#fbbf24,#d97706); }

/* ===== helpers ===== */
const fmt = n => Number(n).toLocaleString('en-US') + ' د.ع';
const fmtShort = n => {
  if (n>=1_000_000) return (n/1_000_000).toFixed(1).replace(/\.0$/,'')+'م د.ع';
  if (n>=1000) return (n/1000).toFixed(0)+'ك د.ع';
  return Number(n).toLocaleString('en-US')+' د.ع';
};
function daysSince(dateStr) {
  const d = new Date(dateStr); const now = new Date('2026-05-10');
  return Math.floor((now - d) / 86400000);
}
function tankHealthLabel(days) {
  if (days < reminderDays) return { label:`خزانك ممتلئ (${reminderDays - days} يوم على التذكير)`, color:'text-leaf-600', pct:Math.min(100, 100 - (days/reclaimDays)*100), klass:'' };
  if (days < warningDays)  return { label:`حان وقت التعبئة (مر ${days} يوم)`, color:'text-warn-600', pct:100 - (days/reclaimDays)*100, klass:'progress-fill-warn' };
  return { label:`تنبيه: قد يُسحَب الخزان! مر ${days} يوم`, color:'text-danger-600', pct:Math.max(8, 100 - (days/reclaimDays)*100), klass:'progress-fill-danger' };
}
function toast(msg, kind='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (kind || '');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

/* ===== view switching ===== */
function setView(v) {
  state.view = v;
  document.getElementById('view-customer').classList.toggle('hidden', v!=='customer');
  document.getElementById('view-worker').classList.toggle('hidden', v!=='worker');
  document.getElementById('view-admin').classList.toggle('hidden', v!=='admin');
  document.getElementById('view-platform').classList.toggle('hidden', v!=='platform');
  ['customer','worker','admin','platform'].forEach(k=>{
    const el = document.getElementById('seg-'+k);
    if (k===v) { el.classList.add('seg-active'); el.classList.remove('text-slate-600'); }
    else { el.classList.remove('seg-active'); el.classList.add('text-slate-600'); }
  });
  if (v==='customer') renderCustomer();
  if (v==='worker')   renderWorker();
  if (v==='admin')    renderAdmin();
  if (v==='platform') renderPlatform();
}

function custGo(tab){ state.cust.tab = tab; renderCustomer(); }

function renderCustomer() {
  document.querySelectorAll('.cust-tab').forEach(t => {
    t.classList.toggle('tab-active', t.dataset.tab === state.cust.tab);
  });
  const root = document.getElementById('cust-content');
  if (!state.cust.onboarded) {
    root.innerHTML = custOnboarding();
    return;
  }
  if (state.cust.tab==='home')    root.innerHTML = custHome();
  if (state.cust.tab==='orders')  root.innerHTML = custOrders();
  if (state.cust.tab==='profile') root.innerHTML = custProfile();
}

  const enRoute = driverTasks.find(t=>t.status==='EN_ROUTE');

          </div>
        </div>
        ${queued > 0 ? `<div class="text-[10px] text-warn-600 mt-2 text-center">🔴 ${queued} عملية محفوظة محلياً — ستُزامَن عند عودة الإنترنت</div>` : ''}

      ${enRoute ? `
        <!-- active task -->
        <div class="bg-aqua-gradient rounded-2xl p-4 text-white shadow-lg mb-3 ripple-bg">

            <div class="absolute bottom-3 left-3 bg-white/95 px-3 py-1.5 rounded-lg text-aqua-700 font-black text-xs num">${enRoute.distance} • ٤ د</div>

          <!-- Arrival auto-detection banner -->
          <div class="bg-white/20 backdrop-blur rounded-xl p-2.5 mt-3 flex items-center gap-2">

            <div class="flex-1 text-xs">
              <div class="font-black text-white">وصلت إلى الزبون</div>
              <div class="text-[10px] opacity-90 num">١٨ م من العنوان المسجّل</div>
            </div>
          </div>

          <button onclick="wrkArrive('ok')" class="w-full bg-white text-aqua-700 rounded-xl py-3 mt-3 font-black text-sm flex items-center justify-center gap-2 shadow-lg">
            ✓ تم التعبئة — أكّد الآن
          </button>

          <div class="mt-2 text-[10px] text-white/70 text-center">جرّب سيناريوهات أخرى:</div>
          <div class="grid grid-cols-2 gap-1.5 mt-1.5 text-[10px] font-bold">

      <div class="space-y-2.5">

      <!-- Walk-in / new customer button -->

        <span class="text-[10px] text-slate-500 font-normal">للجار أو الزبون الذي لم يطلب من التطبيق</span>

    </div>
    ${wrkScanOverlay()}
    ${wrkWalkinSheet()}
    ${wrkReclaimSheet()}
  `;
}

function wrkWalkinOpen() {
  state.wrk.walkin = { open:true, mode:null, search:'', selectedId:null };

}
function wrkWalkinClose(e) {
  if (e && e.target !== e.currentTarget) return;
  state.wrk.walkin = { open:false, mode:null, search:'', selectedId:null };
  renderWorker();
}
function wrkWalkinPickMode(mode) {
  state.wrk.walkin.mode = mode;
  state.wrk.walkin.selectedId = null;
  state.wrk.walkin.search = '';
  renderWorker();
}
function wrkWalkinSetSearch(val) {
  state.wrk.walkin.search = val;
  // Targeted re-render: refresh the results list and customer card,
  // but keep the input focused so the user can keep typing.
  const list = document.getElementById('walkin-results');
  if (list) list.outerHTML = wrkWalkinResultsHTML();
}
function wrkWalkinSelectCustomer(id) {
  state.wrk.walkin.selectedId = id;
  renderWorker();
}
function wrkWalkinBackToSearch() {
  state.wrk.walkin.selectedId = null;
  renderWorker();
}
function wrkWalkinConfirmRefill() {
  const c = driverKnownCustomers.find(x => x.id === state.wrk.walkin.selectedId);
  if (!c) return;
  walkinSalesToday.unshift({
    id:'w'+Date.now(),
    driver:'علي عبد الله',
    customer:c.name,
    district:c.district,
    tankQR:c.tankQR,
    amount:1000,
    time:'الآن',
  });
  // Find this customer in driverTasks history; mark a refill happened.
  // For demo we just close the sheet and toast.
  state.wrk.walkin = { open:false, mode:null, search:'', selectedId:null };
  if (!state.wrk.online) state.wrk.queuedCount += 1;
  toast(state.wrk.online ? `تم تعبئة خزان ${c.name} ✓ ١,٠٠٠ د.ع` : 'محفوظ محلياً ✓ سيُزامَن لاحقاً','success');
  renderWorker();
}
function wrkWalkinConfirmRegister() {
  pendingApprovals.unshift({
    id:'pc'+Date.now(),
    name:'الجار الجديد',
    phone:'07710099003',
    district:'الكرادة',
    byDriver:'علي عبد الله',
    time:'الآن',
    gps:'موقع مأخوذ',
  });
  state.wrk.walkin = { open:false, mode:null };
  toast('تم إرسال طلب التسجيل للمعمل ✓ مكافأة ٥٬٠٠٠ د.ع عند الموافقة','success');
  renderWorker();
}

function wrkWalkinFilteredCustomers() {
  const q = state.wrk.walkin.search.trim().toLowerCase();

  return driverKnownCustomers.filter(c =>
    c.name.toLowerCase().includes(q) ||
    c.phone.includes(q) ||
    c.tankQR.toLowerCase().includes(q)
  ).slice(0, 8);
}

  const results = wrkWalkinFilteredCustomers();

  const r = state.wrk.reclaim;

      tankSerial: task.tankQR.replace('MAA-DEMO-', 'T-').slice(0,8),
      customer: task.customer,
      driver: workerProfile.name,
      reason: r.reason,
      date: '2026-05-11',

  state.wrk.reclaim = { open:false, reason:null, taskId:null };
  toast(`تم سحب الخزان ✓ السبب: ${reason.label}`,'success');
  renderWorker();
}

/**
 * GPS-based arrival flow — replaces the older QR-scan workflow.
 *
 * UX is three quick steps with no manual typing or aiming:
 *   1. Confirm GPS — driver is within geofence of the customer address
 *   2. Capture proof — one photo of the filled tank
 *   3. Record — backend writes the refill, then WhatsApps the customer
 *
 *   scenarios:
 *     'ok'        — all good, refill recorded
 *     'gps-far'   — driver is too far from the customer's registered address
 *     'no-photo'  — driver tries to skip the photo step (rejected)
 */
function wrkArrive(scenario = 'ok') {
  state.wrk.scan = { phase:'capturing', step:2, scenario };
  renderWorker();

  setTimeout(() => {
    if (scenario === 'gps-far') {
      state.wrk.scan = {
        phase:'fail', step:1,
        error:'أنت على بُعد ٤١٢م من عنوان الزبون المسجّل. تجاوز الحد المسموح (٥٠م). تأكد أنك عند البيت الصحيح.',
        scenario,
      };
      renderWorker();
      return;
    }
    if (scenario === 'no-photo') {
      state.wrk.scan = {
        phase:'fail', step:2,
        error:'الصورة إلزامية — هي دليل التعبئة في حال أي نزاع. حاول مرة أخرى.',
        scenario,
      };
      renderWorker();
      return;
    }
    state.wrk.scan = { phase:'recording', step:3, scenario };
    renderWorker();
  }, 1100);

  setTimeout(() => {
    if (state.wrk.scan.phase !== 'recording') return;
    state.wrk.scan = { phase:'complete', step:3, scenario };
    const enRoute = driverTasks.find(t=>t.status==='EN_ROUTE');
    if (enRoute) enRoute.status = 'COMPLETED';
    const nextAssigned = driverTasks.find(t=>t.status==='ASSIGNED');
    if (nextAssigned) nextAssigned.status = 'EN_ROUTE';
    renderWorker();
  }, 2200);

  setTimeout(() => {
    if (state.wrk.scan.phase === 'complete') {
      state.wrk.scan = { phase:'idle', error:null };
      if (!state.wrk.online) {
        state.wrk.queuedCount += 1;
        toast('تم حفظ التعبئة في الهاتف ✓ ستُزامَن عند عودة الإنترنت','warn');
      } else {
        toast('تم تأكيد التعبئة ✓ ١٠٠٠ د.ع — وأُرسل تأكيد واتساب للزبون','success');
      }
      renderWorker();
    }
  }, 4500);
}

function wrkCloseScan() {
  state.wrk.scan = { phase:'idle', error:null };
  renderWorker();
}

/* Returns the verification overlay HTML during an arrival/completion flow. */
function wrkScanOverlay() {
  const s = state.wrk.scan;
  if (s.phase === 'idle') return '';

  const step = (n, label) => {
    let icon = '○', klass = 'step-pending';
    if (s.phase === 'complete' || s.step > n) { icon = '✓'; klass = 'step-done'; }
    else if (s.step === n && s.phase !== 'fail') { icon = '⋯'; klass = 'step-active'; }
    else if (s.step === n && s.phase === 'fail') { icon = '✗'; klass = 'bg-danger-500 text-white'; }
    return `
      <div class="flex items-center gap-3 py-1.5">
        <div class="w-7 h-7 rounded-full ${klass} flex items-center justify-center text-xs font-black ring-step">${icon}</div>
        <div class="text-xs font-bold ${s.step > n ? 'text-leaf-700' : s.step === n && s.phase === 'fail' ? 'text-danger-700' : 'text-slate-700'}">${label}</div>
      </div>
    `;
  };

  const isFail = s.phase === 'fail';
  const isDone = s.phase === 'complete';
  const phaseLabel = ({
    capturing:'جاري التقاط صورة الخزان…',
    recording:'جاري تسجيل التعبئة…',
  })[s.phase] || (isDone?'تمت التعبئة':isFail?'تم رفض التعبئة':'');

  return `
    <div class="absolute inset-0 z-30 bg-slate-900/70 backdrop-blur-sm flex items-end">
      <div class="bg-white w-full rounded-t-3xl p-5">
        <div class="text-center mb-3">
          <div class="w-14 h-14 mx-auto rounded-2xl ${isDone?'bg-leaf-gradient':isFail?'bg-danger-gradient':'bg-aqua-gradient'} flex items-center justify-center text-white text-2xl mb-2">
            ${isDone?'✓':isFail?'✗':'📍'}
          </div>
          <div class="font-black text-lg text-slate-900">${phaseLabel}</div>
          <div class="text-xs text-slate-500 mt-0.5">${isDone?'تم تسجيل العملية بنجاح':isFail?'صحّح الخطأ وحاول مجدداً':'تأكيد بدون مسح QR'}</div>
        </div>

        <div class="bg-slate-50 rounded-xl p-3 space-y-1">
          ${step(1, 'موقعك يطابق عنوان الزبون (GPS)')}
          ${step(2, 'صورة الخزان كدليل')}
          ${step(3, 'تسجيل التعبئة وإرسال تأكيد للزبون')}
        </div>

        ${s.phase === 'capturing' ? `
          <div class="bg-slate-900 rounded-xl mt-3 aspect-[4/3] flex items-center justify-center relative overflow-hidden">
            <div class="absolute inset-0 map-bg opacity-30"></div>
            <div class="relative text-center text-white">
              <div class="text-5xl mb-2">🛢️</div>
              <div class="text-xs opacity-80">وجّه الكاميرا للخزان</div>
            </div>
            <div class="absolute inset-3 border-2 border-white/40 border-dashed rounded-lg"></div>
          </div>
        ` : ''}

        ${isFail ? `
          <div class="bg-danger-50 border border-danger-200 rounded-xl p-3 mt-3">
            <div class="text-xs font-black text-danger-700 mb-1">⚠ سبب الرفض</div>
            <div class="text-xs text-danger-700 leading-relaxed">${s.error}</div>
          </div>
        ` : ''}

        ${isDone ? `
          <div class="bg-leaf-50 border border-leaf-200 rounded-xl p-3 mt-3 text-xs text-leaf-700 leading-relaxed">
            ✓ سُجّلت التعبئة بـ ١٠٠٠ د.ع<br>
            ✓ الصورة محفوظة كدليل<br>
            ✓ أُرسل "أكّد التعبئة" للزبون عبر WhatsApp
          </div>
        ` : ''}

        <button onclick="wrkCloseScan()" class="w-full mt-4 ${isFail||isDone?'bg-slate-900':'bg-slate-200'} ${isFail||isDone?'text-white':'text-slate-500'} rounded-xl py-3 font-black text-sm">
          ${isDone?'إغلاق':isFail?'إعادة المحاولة':'إلغاء'}
        </button>
      </div>
    </div>
  `;
}

function admApproveCustomer(id) {
  const i = pendingApprovals.findIndex(c => c.id === id);
  if (i >= 0) {
    const c = pendingApprovals[i];
    pendingApprovals.splice(i, 1);
    toast(`تمت الموافقة على ${c.name} ✓ مكافأة ٥٬٠٠٠ د.ع للسائق`, 'success');
    renderAdmin();
  }
}
function admRejectCustomer(id) {
  const i = pendingApprovals.findIndex(c => c.id === id);
  if (i >= 0) {
    pendingApprovals.splice(i, 1);
    toast('تم رفض الطلب', 'warn');
    renderAdmin();
  }
}

function admBonusAdjust(key, delta) {
  state.adm.bonuses[key] = Math.max(0, (state.adm.bonuses[key]||0) + delta);
  renderAdmin();
}
function admBonusSet(key, val) {
  state.adm.bonuses[key] = Math.max(0, Number(val) || 0);
  renderAdmin();
}
function admSaveBonuses() { toast('تم حفظ إعدادات المكافآت ✓','success'); }

function renderPlatform() {

    else { n.classList.remove('nav-active'); n.classList.add('text-slate-300'); }
  });
  const root = document.getElementById('plat-content');
  if (state.plat.nav==='overview')      root.innerHTML = platOverview();
  if (state.plat.nav==='plants')        root.innerHTML = platPlants();
  if (state.plat.nav==='subscriptions') root.innerHTML = platSubscriptions();
