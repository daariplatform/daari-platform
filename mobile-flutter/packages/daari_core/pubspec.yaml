name: daari_core
description: >-
  القلب المشترك لتطبيقَي «داري» (الزبون + السائق): النماذج، عميل الـ API،
  المصادقة، نظام التصميم، التنسيق، وخدمات الموقع والإشعارات. منقول من تطبيقَي Expo.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  # الشبكة + interceptors (بديل axios)
  dio: ^5.7.0

  # إدارة الحالة (بديل zustand + react-query) — بدون توليد كود
  flutter_riverpod: ^2.6.1

  # تخزين آمن للتوكنات (بديل expo-secure-store)
  flutter_secure_storage: ^9.2.2

  # مصادقة بيومترية (بصمة/وجه) — قفل الدخول للوحة الإدارة (بديل expo-local-authentication)
  local_auth: ^2.3.0

  # تخزين بسيط للأعلام والطابور الأوفلاين (بديل AsyncStorage)
  shared_preferences: ^2.3.2

  # طابور الطفرات الأوفلاين (بديل expo-sqlite في worker/lib/offline-queue.ts)
  sqflite: ^2.4.1

  # كشف حالة الاتصال (شريط «غير متصل» + تصريف الطابور عند عودة الشبكة)
  connectivity_plus: ^6.1.0

  # رصد الأعطال (بديل @sentry/react-native في lib/sentry.ts)
  # 9.x يستعمل Kotlin Gradle Plugin حديثاً (8.x كان يفشل البناء على مترجم Kotlin
  # الجديد — Language version 1.6). الـ API المستعمَل (init/configureScope/setTag) ثابت.
  sentry_flutter: ^9.0.0

  # التحليلات + تتبّع المسارات (بديل posthog-react-native في lib/posthog.ts)
  # 5.x يستعمل Kotlin Gradle Plugin حديثاً — 4.x كان يفشل البناء على مترجم
  # Kotlin الجديد (Language version 1.6 no longer supported).
  posthog_flutter: ^5.0.0

  # التنسيق العربي + IQD (بديل date-fns + Intl)
  # نطاق واسع ليتوافق مع نسخة intl التي يثبّتها flutter_localizations
  intl: ">=0.18.0 <0.21.0"

  # خط Cairo (بديل expo-font)
  google_fonts: ^6.2.1

  # الموقع الجغرافي (بديل expo-location)
  geolocator: ^13.0.1

  # فتح الهاتف/واتساب/الملاحة الخارجية (بديل Linking)
  url_launcher: ^6.3.1

  # إشعارات FCM (بديل expo-notifications + Expo Push)
  # firebase_core يأتي ترانزِتيفيًا عبر firebase_messaging؛ التطبيقات تُصرِّحه
  # بنفسها وتستدعي Firebase.initializeApp — القلب يستعمل FirebaseMessaging فقط.
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1

  # فتح إعدادات الإشعارات في النظام (تبديل الإذن من داخل التطبيق)
  # 6.x+ يُجمَّع على compileSdk حديث (5.x كان على 33 فيرفضه AGP 9 مع androidx).
  app_settings: ^6.1.1

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
