name: daari_customer
description: تطبيق الزبون «داري» — طلب تعبئة المياه وتتبّعها (Flutter).
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # الحزمة المشتركة (النماذج + API + المصادقة + التصميم + الخدمات)
  daari_core:
    path: ../../packages/daari_core

  # إدارة الحالة
  flutter_riverpod: ^2.6.1

  # تهيئة تنسيق التواريخ العربية + Firebase للإشعارات (يُستعملان في main.dart)
  intl: ">=0.18.0 <0.21.0"
  firebase_core: ^3.6.0

  # التوجيه
  go_router: ^14.6.1

  # الخرائط (منتقي العنوان + تتبّع السائق)
  google_maps_flutter: ^2.9.0

  # الموقع (منتقي العنوان في التسجيل)
  geolocator: ^13.0.1

  # عكس الترميز الجغرافي (إحداثيات → نصّ عنوان في منتقي الخريطة)
  geocoding: ^3.0.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
