name: daari_driver
description: تطبيق السائق «داري» — استلام الطلبات وتوصيل المياه (Flutter).
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # الحزمة المشتركة (النماذج + API + المصادقة + التصميم + الخدمات)
  daari_core:
    path: ../../packages/daari_core

  flutter_riverpod: ^2.6.1
  go_router: ^14.6.1

  # تهيئة تنسيق التواريخ العربية + Firebase للإشعارات (يُستعملان في main.dart)
  intl: ">=0.18.0 <0.21.0"
  firebase_core: ^3.6.0

  # خريطة موقع الزبون داخل المهمة (الوصول للموقع عبر LocationService في daari_core)
  google_maps_flutter: ^2.9.0

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
