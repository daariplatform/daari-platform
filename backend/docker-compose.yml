version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: maa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: maa
      # Override via POSTGRES_PASSWORD in a .env / shell var for any shared
      # environment. The default is local-dev only.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maa_password}
      POSTGRES_DB: maa_platform
    ports:
      # Loopback only — the DB must never be reachable from the network
      # (audit finding M-S1).
      - "127.0.0.1:5432:5432"
    volumes:
      - maa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maa -d maa_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: maa_redis
    restart: unless-stopped
    # Require a password when REDIS_PASSWORD is set; harmless (no auth) for
    # local dev when it is unset.
    command: ["sh", "-c", "redis-server ${REDIS_PASSWORD:+--requirepass \"$REDIS_PASSWORD\"}"]
    ports:
      # Loopback only — Redis must never be reachable from the network
      # (audit finding M-S1).
      - "127.0.0.1:6379:6379"
    volumes:
      - maa_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  maa_postgres_data:
  maa_redis_data:
