version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: maa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: maa
      POSTGRES_PASSWORD: maa_password
      POSTGRES_DB: maa_platform
    ports:
      - "5432:5432"
    volumes:
      - maa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maa -d maa_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: maa_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - maa_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  maa_postgres_data:
  maa_redis_data:
